name: Release

# Push a tag matching package.json's version (e.g. v0.1.0) to publish a GitHub
# Release with all five binaries, SHA256SUMS and install.sh.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            targets: --target linux-x64 --target linux-arm64 --target windows-x64
            smoke: ./dist/topcited-linux-x64
          # darwin binaries are built on macOS so they get a valid ad-hoc signature.
          - runner: macos-14
            targets: --target darwin-x64 --target darwin-arm64
            smoke: ./dist/topcited-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        run: |
          want="v$(jq -r .version package.json)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME != $want"; exit 1; }
      - run: bun test
      - run: bun run build ${{ matrix.targets }}
      - name: Smoke test
        run: ${{ matrix.smoke }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.runner }}
          path: dist/topcited-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum topcited-* > SHA256SUMS
          cat SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 5 ] || { echo "expected 5 binaries"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh dist/install.sh
          # v1.2.0-rc.1 etc. must not become releases/latest (install.sh, `upgrade`).
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" dist/topcited-* dist/SHA256SUMS dist/install.sh \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $pre
