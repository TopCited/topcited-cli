name: Release

# Push a tag matching package.json's version (e.g. v0.1.0) to publish a GitHub
# Release with all five binaries, SHA256SUMS, install.sh and install.ps1, then
# update the Homebrew tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            targets: --target linux-x64 --target linux-arm64 --target windows-x64
            smoke: ./dist/topcited-linux-x64
          # darwin binaries are built on macOS so they get a valid ad-hoc signature.
          - runner: macos-14
            targets: --target darwin-x64 --target darwin-arm64
            smoke: ./dist/topcited-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        run: |
          want="v$(jq -r .version package.json)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME != $want"; exit 1; }
      - run: bun test
      - run: bun run build ${{ matrix.targets }}
      - name: Smoke test
        run: ${{ matrix.smoke }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.runner }}
          path: dist/topcited-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum topcited-* > SHA256SUMS
          cat SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 5 ] || { echo "expected 5 binaries"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh install.ps1 dist/
          # v1.2.0-rc.1 etc. must not become releases/latest (install.sh, `upgrade`).
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" dist/topcited-* dist/SHA256SUMS dist/install.sh dist/install.ps1 \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $pre

  homebrew:
    needs: release
    # Prereleases never reach the tap.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      # Fine-grained token with Contents: write on TopCited/homebrew-tap only.
      # The tap must be public, so it's created at launch; until then this job skips.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Skip without a tap token
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap update."
      - uses: actions/checkout@v4
        if: env.HOMEBREW_TAP_TOKEN != ''
      - uses: oven-sh/setup-bun@v2
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          bun-version: 1.3.11
      - name: Render formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir dist
          bun run scripts/render-formula.ts --version "$GITHUB_REF_NAME" --sums dist/SHA256SUMS > topcited.rb
          cat topcited.rb
      - name: Push to TopCited/homebrew-tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/TopCited/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp topcited.rb tap/Formula/topcited.rb
          cd tap
          if git diff --quiet -- Formula/topcited.rb && ! git ls-files --others --exclude-standard | grep -q .; then
            echo "Formula already at $GITHUB_REF_NAME"; exit 0
          fi
          git config user.name "topcited-release[bot]"
          git config user.email "release@users.noreply.github.com"
          git add Formula/topcited.rb
          git commit -m "topcited ${GITHUB_REF_NAME#v}"
          git push origin HEAD
